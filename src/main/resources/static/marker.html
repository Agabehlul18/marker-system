<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marker Paneli - Əlyazma Yoxlama</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-bar {
            background-color: var(--primary-color);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
            margin-bottom: 24px;
        }

        .header-bar h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .info-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .info-item span {
            display: block;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
        }

        .info-item strong {
            font-size: 16px;
            color: var(--primary-color);
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .question-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #2c3e50;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 8px;
        }

        .image-container {
            width: 100%;
            background: #fafafa;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .image-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .score-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8fdf9;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #c8e6c9;
        }

        .score-control label {
            font-weight: 600;
            color: var(--primary-color);
        }

        .score-input {
            width: 80px;
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            text-align: center;
        }

        .score-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.2);
        }

        .quick-btn {
            background: #e8f5e9;
            color: var(--primary-color);
            border: 1px solid #a5d6a7;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .action-container {
            text-align: right;
            margin-top: 30px;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .empty-state h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>BSP LearnUp - Marker Yoxlama Paneli</h1>
        <span id="status-badge">Aktiv</span>
    </div>

    <div id="loading" style="text-align: center; padding: 40px;">
        <h3>Yoxlanılacaq işlər gətirilir...</h3>
    </div>

    <div id="empty-view" class="empty-state" style="display: none;">
        <h2>Bütün işlər yoxlanıldı!</h2>
        <p>Hazırda növbədə gözləyən açıq sual yoxdur.</p>
        <button class="quick-btn" onclick="fetchNextSubmission()" style="margin-top: 15px;">Yenidən yoxla</button>
    </div>

    <div id="paper-view" style="display: none;">
        <div class="info-card">
            <div class="info-item">
                <span>Ad Soyad</span>
                <strong id="student-name">-</strong>
            </div>
            <div class="info-item">
                <span>İş Nömrəsi</span>
                <strong id="student-id">-</strong>
            </div>
            <div class="info-item">
                <span>Sinif / Variant</span>
                <strong id="student-class-variant">-</strong>
            </div>
            <div class="info-item">
                <span>Qapalı Düz Sayı</span>
                <strong id="closed-count">-</strong>
            </div>
        </div>

        <div id="questions-list"></div>

        <div class="action-container">
            <button class="btn-submit" onclick="submitGrades()">Təsdiqlə və Növbəti İşə Keç →</button>
        </div>
    </div>
</div>

<script>
    let currentSubmission = null;

    async function fetchNextSubmission() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('paper-view').style.display = 'none';
        document.getElementById('empty-view').style.display = 'none';

        try {
            const response = await fetch('/api/marker/next');

            if (response.status === 204 || !response.ok) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('empty-view').style.display = 'block';
                currentSubmission = null;
                return;
            }

            currentSubmission = await response.json();
            renderSubmission(currentSubmission);
        } catch (error) {
            console.error('Xəta baş verdi:', error);
            alert('Məlumatları gətirərkən xəta yarandı.');
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderSubmission(data) {
        document.getElementById('student-name').innerText = data.adSoyad || 'Qeyd edilməyib';
        document.getElementById('student-id').innerText = data.isNomresi || '-';
        document.getElementById('student-class-variant').innerText = `${data.sinif || '-'} / Variant ${data.variant || '-'}`;
        document.getElementById('closed-count').innerText = `${data.closedCorrectCount || 0} düz`;

        const container = document.getElementById('questions-list');
        container.innerHTML = '';

        if (!data.writtenQuestions || data.writtenQuestions.length === 0) {
            container.innerHTML = '<p>Bu şagird üçün yazı sualı tapılmadı.</p>';
        } else {
            data.writtenQuestions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="question-title">Sual № ${q.questionNumber}</div>
                    <div class="image-container">
                        <img src="${q.imagePath}" alt="Sual ${q.questionNumber} Cavab Şəkli"
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/600x200?text=Şəkil+Tapılmadı';">
                    </div>
                    <div class="score-control">
    <label for="score-${q.id}">Xal:</label>
    <input type="number" step="0.01" min="0" max="1" id="score-${q.id}"
           class="score-input" value="${q.score || 0}">

    <button type="button" class="quick-btn" onclick="setScore(${q.id}, 0)">0</button>
    <button type="button" class="quick-btn" onclick="setScore(${q.id}, 0.33)">1/3</button>
    <button type="button" class="quick-btn" onclick="setScore(${q.id}, 0.67)">2/3</button>
    <button type="button" class="quick-btn" onclick="setScore(${q.id}, 1)">1 (Tam)</button>
</div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('paper-view').style.display = 'block';
    }

    function setScore(questionId, value) {
        const input = document.getElementById(`score-${questionId}`);
        if (input) input.value = value;
    }

    async function submitGrades() {
        if (!currentSubmission) return;

        const scores = {};
        let isValid = true;

        currentSubmission.writtenQuestions.forEach(q => {
            const input = document.getElementById(`score-${q.id}`);
            const val = parseFloat(input.value);
            if (isNaN(val) || val < 0) {
                isValid = false;
            }
            scores[q.id] = val;
        });

        if (!isValid) {
            alert('Zəhmət olmasa bütün suallara düzgün bal daxil edin!');
            return;
        }

        try {
            const response = await fetch(`/api/marker/grade/${currentSubmission.id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ questionScores: scores })
            });

            if (response.ok) {
                fetchNextSubmission();
            } else {
                alert('Qiymətləndirməni yadda saxlayarkən xəta baş verdi.');
            }
        } catch (error) {
            console.error('Göndərmə xətası:', error);
            alert('Serverlə əlaqə kəsildi.');
        }
    }

    // Səhifə yüklənəndə ilk işi gətir
    window.onload = fetchNextSubmission;
</script>

</body>
</html>
